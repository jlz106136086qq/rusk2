name: SOS程序生成

# 专用于生成 SOS 版(富氏邦定制客户端)程序。
# 仅保留此工作流用于出包，其余工作流已禁用以节省资源。
on:
  workflow_dispatch:
  # 富氏邦SOS定制: 推送 sos-auto-* 标签可自动触发出包(无需网页手动点)
  push:
    tags:
      - 'sos-auto-*'

jobs:
  build-sos:
    uses: ./.github/workflows/flutter-build-vumstar.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: sos-${{ github.run_number }}
